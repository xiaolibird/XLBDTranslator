# 发表源白/黑名单（三态：white / black / gray）
#
# 为什么用人工名单而不是算法判据 —— 2026-08-24 审计逐条证伪了自动方案
# （全文见 docs/decisions/venue_quality_audit_2026-08.md）：
#   · 刊名正则：命中的 28 个「可疑刊名」里绝大多数是正经刊，
#     International Journal of Computer Vision 是 CV 顶刊 IJCV。
#   · h-index：被发文量稀释。IJCA（公认水刊）h=113，因为它发了 28094 篇。
#   · 刊级 IF：OpenAlex 不给会议算，KDD / WWW 一律返 0.0，按 IF 断层删先杀顶会。
#   · 单篇被引：测的是「这篇影响力」不是「这个 venue 是不是野鸡」——
#     实测把 3 篇真 AAAI/NeurIPS 冷门论文判成了可疑
#     （eiben2021Parameterized 是理论 CS，5 年 2 引）。
# 而本领域的 venue 就那么几十个，人工定一次比任何算法都准。
#
# **gray 是常态，不是问题**：库内 727 个 venue 里 484 个只出现 1 次，top45 才覆盖
# 40.8%。白名单不可能列全，它只负责标出「确定可信」；没列到的一律 gray，
# 既不加分也不减分。**绝不要把 gray 当成 black 来处置。**
#
# 匹配优先级：issn > doi_prefix > name_regex。ISSN 最准（不受刊名变体/大小写影响），
# 来自 Crossref 缓存 output/scholar_notes/crossref_works_cache.json。
# 会议大多没有 ISSN，只能靠 name_regex。
#
# 维护提示：新增 black 条目务必写清依据（除名/撤稿批量/论文工厂报道），
# 这张表会决定文献被不被踢出向量库，含糊的「我觉得不太行」不要进 black，放 gray。

black:
  # 出版商级：按 DOI 前缀判。**不能按 Crossref 的 publisher 字段**——
  # Hindawi 被 Wiley 收购后 publisher 显示为 "Wiley"，按它判会漏掉全部 Hindawi 刊。
  doi_prefix:
    "10.1155": "Hindawi：2022-2023 论文工厂丑闻，Wiley 关停该品牌并撤稿逾 1.1 万篇，多刊被 Clarivate 除名"
    "10.5120": "International Journal of Computer Applications / Foundation of Computer Science：公认水刊，IF 0.42 而发文 28094"
    "10.4236": "SCIRP (Scientific Research Publishing)：公认掠夺性出版商"
    "10.4172": "OMICS International：公认掠夺性，2019 年被美国 FTC 判罚 5010 万美元"
    "10.19026": "Science Publishing Group：公认掠夺性"
    "10.5281": "Zenodo 自助上传：非同行评审平台，任何人可发布（≠ 预印本服务器）"
  issn: {}
  # 刊名精确匹配（小写比较）。留给「出版商整体没问题、个别刊出事」的情况。
  name_exact: {}

