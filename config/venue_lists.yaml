# ---- 2026-08-24 联网核实过、结论是「不是野鸡但也不进白名单」的 ----
#   Computers, Materials & Continua (Tech Science Press) — 仍在 WoS/Scopus，IF 2.4，
#     影响力一般，留 gray（曾怀疑被除名，实查未发现）
#   Informatics in Medicine Unlocked (Elsevier) — 仍活跃、仍被 Scopus 索引
#     （曾怀疑被除名，实查未发现）
#
# 明确**不进白名单**的争议 venue（放这里只为留档，行为上等同 gray）：
#   Scientific Reports (2045-2322)  — Nature 旗下但审稿以宽松著称
#   IEEE Access (2169-3536)         — open access、审稿快，质量方差大
#   PLOS ONE (1932-6203)            — 只审「方法是否正确」不审「是否重要」
#   Sensors / Journal of Clinical Medicine 等 MDPI 刊 (10.3390)
#   Frontiers 系 (10.3389)          — Frontiers in Medicine IF 2.46，不算差但方差大
#   Lecture Notes in Computer Science (0302-9743) — 丛书，从顶会到 workshop 什么都有
# 它们既不该被当野鸡踢，也不该被当顶刊加权，gray 就是最诚实的位置。
gray_note: "未列入白/黑名单的一律 gray：不加分不减分，不作任何处置依据。"
