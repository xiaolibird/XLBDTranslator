# CI：静态门 + 全量测试。
# 收集数口径：CI(Linux) 应为 1889 = 本机 1884 + weasyprint 的 5 例
# （macOS 本机缺 pango 系库，test_pdf_rendering.py 模块级 skip、收集为 0；
#  Linux 装齐 apt 面后真收集——这也是下面 import weasyprint 硬探针存在的原因：
#  apt 装漏时模块级 skip 会把缺库吞成静默绿，探针让它响亮地红）。
name: CI

on:
  push:
    branches: [master, scholar-digest]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_scholar.txt
            requirements-dev.txt

      # weasyprint 67 的实际 dlopen 面：gobject/pango/pangoft2/harfbuzz/fontconfig
      # （v53 起已弃 cairo 与 gdk-pixbuf；harfbuzz-subset 为 allow_fail 可选项）
      - name: Install system libraries for weasyprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_scholar.txt -r requirements-dev.txt

      # 硬探针：apt 面不足时在这里响亮地红，而不是被 5 个 PDF 测试静默 skip 吞掉
      - name: Probe weasyprint import
        run: python -c "import weasyprint; print(weasyprint.__version__)"

      # 语法/未定义名级静态门：专兜 scripts/ 下 40+ 个 pytest 不 import 的无人值守入口
      - name: Ruff (syntax gate)
        run: ruff check --select E9,F63,F7,F82 src scripts test

      - name: Run tests
        run: pytest test/ -q
